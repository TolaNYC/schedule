<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d100b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100b" media="(prefers-color-scheme: dark)">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<title>Artur's Schedule</title>
<style>
/* Layout: the calendar fills the screen; one toolbar row on top; requests float in a sheet over it. */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface-2:#f4f7f2; --surface-3:#e9eee6;
  --text:#1f2a24; --muted:#5a6a61; --faint:#8a978f; --line:#e1e7de; --line-strong:#cfd8cb;
  --accent:#2f6b47; --accent-hover:#255a3b; --on-accent:#ffffff; --accent-soft:#e3f0e6;
  --free:#e6f3e9; --free-line:#b9dcc3; --free-text:#1f4d33; --free-hover:#d3ead9;
  --busy:#f6dfdb; --busy-line:#e8b8b1; --busy-text:#7f3129;
  --buf:#fbecd3; --buf-line:#e5c088; --buf-text:#6a4413;
  --pend:#ebe7f8; --pend-line:#bfb3e3; --pend-text:#46397a;
  --past:#f1f3ef; --past-text:#9aa59e;
  --shadow-sm:0 1px 2px rgba(25,40,30,.06),0 1px 1px rgba(25,40,30,.04);
  --shadow-md:0 8px 24px rgba(25,40,30,.08);
  --shadow-lg:0 24px 60px rgba(20,35,25,.20);
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --timew:48px; --slot:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171e1a; --surface-2:#1d2620; --surface-3:#243028;
  --text:#e4ebe6; --muted:#a2b0a7; --faint:#75837a; --line:#26302a; --line-strong:#334038;
  --accent:#7cc493; --accent-hover:#93d3a7; --on-accent:#0e1c13; --accent-soft:#1e3326;
  --free:#1b3124; --free-line:#2f5a3e; --free-text:#c3e6cd; --free-hover:#22402d;
  --busy:#352120; --busy-line:#673833; --busy-text:#f0c3bd;
  --buf:#342a19; --buf-line:#6f5226; --buf-text:#f0d4a3;
  --pend:#262239; --pend-line:#4e4486; --pend-text:#d2c9f4;
  --past:#1a201c; --past-text:#5f6c64;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171e1a; --surface-2:#1d2620; --surface-3:#243028;
  --text:#e4ebe6; --muted:#a2b0a7; --faint:#75837a; --line:#26302a; --line-strong:#334038;
  --accent:#7cc493; --accent-hover:#93d3a7; --on-accent:#0e1c13; --accent-soft:#1e3326;
  --free:#1b3124; --free-line:#2f5a3e; --free-text:#c3e6cd; --free-hover:#22402d;
  --busy:#352120; --busy-line:#673833; --busy-text:#f0c3bd;
  --buf:#342a19; --buf-line:#6f5226; --buf-text:#f0d4a3;
  --pend:#262239; --pend-line:#4e4486; --pend-text:#d2c9f4;
  --past:#1a201c; --past-text:#5f6c64;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font);margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:16px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fine{font-size:12px;color:var(--muted);margin:0;text-align:center}

.wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:8px;max-width:1440px;margin:0 auto;padding-block:8px;padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--font);border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:8px 14px;min-height:36px;cursor:pointer;text-decoration:none;transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){color:var(--text);background:var(--surface-2)}
.btn-danger{background:transparent;color:var(--busy-text);border-color:var(--busy-line)}
.btn-icon{width:32px;min-height:32px;height:32px;padding:0;font-size:16px;line-height:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 13px var(--font);padding:6px 12px;border-radius:8px;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.note{font-size:13px;border-radius:var(--r-md);padding:10px 12px;background:var(--pend);color:var(--pend-text)}
.note.err{background:var(--busy);color:var(--busy-text)}

/* ---------- owner bar (hidden for visitors) ---------- */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.topbar:has(#mode[hidden]){display:none}

/* ---------- calendar card ---------- */
.layout{flex:1;display:flex;flex-direction:column;min-height:0}
.layout[hidden]{display:none}
.cal{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;padding:10px 12px}
.nav{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.nav-left{display:flex;align-items:center;gap:4px;min-width:0}
.nav h2{font-size:15px;font-weight:700;white-space:nowrap;padding:0 4px;font-variant-numeric:tabular-nums}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.sync.stale i{background:var(--buf-line)}
.legend{display:flex;align-items:center;gap:4px 12px;font-size:12px;color:var(--muted);flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.cal-legend{flex:1;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;border:1px solid}
.sw-free{background:var(--free);border-color:var(--free-line)}
.sw-busy{background:var(--busy);border-color:var(--busy-line)}
.sw-buf{background:var(--buf);border-color:var(--buf-line)}
.sw-pend{background:var(--pend);border-color:var(--pend-line)}

/* day strip (day view) */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip[hidden]{display:none}
.strip button{border:1px solid transparent;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;transition:background-color .2s ease}
.strip button small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strip button strong{font-size:15px;font-variant-numeric:tabular-nums}
.strip button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.strip button[aria-pressed="true"] small{color:var(--on-accent)}

/* time grid */
.scroller{flex:1;min-height:0;overflow:hidden}
.grid{display:grid;grid-template-columns:var(--timew) repeat(var(--cols),minmax(0,1fr))}
.dayhead{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:2px 2px 6px;white-space:nowrap;overflow:hidden;min-width:0}
.dayhead small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dayhead strong{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.dayhead.today strong{color:var(--on-accent);background:var(--accent);border-radius:999px;padding:0 7px}
.grid:not(.week) > .dayhead, .grid:not(.week) > div:first-child{display:none}
.times{position:relative}
.times span{position:absolute;right:8px;transform:translateY(-7px);font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px calc(var(--slot) * 2))}
.blk,.slot{position:absolute;left:2px;right:2px;border-radius:var(--r-sm);font-size:11px;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;min-width:0}
.blk{border:1px solid;font-weight:600}
.blk.busy{background:var(--busy);border-color:var(--busy-line);color:var(--busy-text);align-items:flex-start;padding-top:3px}
.blk.buf{background:var(--buf);border-color:var(--buf-line);color:var(--buf-text)}
.blk.pend{background:var(--pend);border-color:var(--pend-line);color:var(--pend-text);align-items:flex-start;padding-top:3px}
.blk.past{background:var(--past);border-color:transparent;color:var(--past-text)}
.slot{border:1px solid var(--free-line);background:var(--free);color:var(--free-text);font:700 11px var(--font);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums;transition:background-color .15s ease,border-color .15s ease}
.slot:hover{background:var(--free-hover);border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);z-index:1}
/* narrow columns: smaller type; very narrow: colour only */
.grid.narrow{--timew:38px}
.grid.narrow .times span{font-size:10px;right:5px}
.grid.narrow .slot,.grid.narrow .blk{font-size:10px;padding:0 4px}
.grid.narrow .dayhead{flex-direction:column;align-items:center;gap:0}
.grid.narrow .dayhead small{font-size:9px}
.grid.narrow .dayhead strong{font-size:13px}
.grid.mini .slot,.grid.mini .blk{font-size:9px;padding:0 1px;justify-content:center;letter-spacing:-.02em;text-overflow:clip}
.grid.mini .blk.busy,.grid.mini .blk.pend{align-items:flex-start}
.grid.mini .blk,.grid.mini .slot{left:1px;right:1px;border-radius:4px}
.grid.tight .slot,.grid.tight .blk{border-radius:4px}

/* ---------- request sheet ---------- */
.panel{position:fixed;z-index:40;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));width:min(380px, calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain;padding:0;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s ease}
.panel[data-state="closed"]{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
.panel[data-state="peek"] .sheet-body{display:none}
.panel[data-state="open"] .sheet-bar{display:none}
.sheet-bar{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 14px;cursor:pointer;font-family:var(--font)}
.sheet-bar:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:var(--r-lg)}
.handle{display:none}
.bar-orb{width:32px;height:32px;flex:none;border-radius:var(--r-md);background:var(--accent-soft);position:relative}
.bar-orb::after{content:"";position:absolute;inset:10px;border-radius:3px;background:var(--accent)}
.bar-text{display:flex;flex-direction:column;min-width:0;flex:1}
.bar-text strong{font-size:14px}
.bar-text small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-cta{background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;border-radius:var(--r-md);padding:9px 14px;flex:none}
.panel.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:translateY(-4px)}}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;gap:8px}
.panel-head h2{margin-right:auto}
.total-pill,.count-pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.total-pill{color:var(--free-text);background:var(--free)}
.count-pill{color:var(--pend);background:var(--pend-text);min-width:24px;text-align:center}
.sheet-min{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:var(--r-md);font-size:16px;line-height:1;cursor:pointer;flex:none}
.sheet-min:hover{color:var(--text);background:var(--surface-2)}
#reqform{display:flex;flex-direction:column;gap:12px}
#reqform[hidden],.sent[hidden],.empty[hidden]{display:none}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:168px;overflow:auto}
.chip{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:7px 6px 7px 12px}
.chip strong{font-size:13px;grid-column:1}
.chip span{font-size:12px;color:var(--muted);grid-column:1}
.chip-x{grid-column:2;grid-row:1 / span 2;width:28px;height:28px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.chip-x:hover{background:var(--surface-3);color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.input{font:14px var(--font);color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:9px 11px;width:100%;resize:vertical;transition:border-color .2s ease,box-shadow .2s ease}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--busy-line);box-shadow:0 0 0 3px var(--busy)}
.btn-send{width:100%;min-height:42px;font-size:14px}
.sent{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0}
.sent .check{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.sent h3{font-size:17px}
.sent ul{list-style:none;margin:0;padding:0;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.sent p{margin:0;color:var(--muted);font-size:13px}
.copybox{width:100%;min-height:110px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);font:13px var(--font);padding:10px}
.backdrop{position:fixed;inset:0;z-index:39;background:rgba(15,25,18,.4);opacity:0;pointer-events:none;transition:opacity .3s ease}
.backdrop.on{opacity:1;pointer-events:auto}
.dock,.waiting{display:none!important}

/* ---------- admin ---------- */
#adminview{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
#adminview[hidden]{display:none}
#adminview .cal{flex:none}
.ad-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
.ad-bar strong{font-size:14px}
.ad-bar .fine{text-align:left}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.ad-reqs-card{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ad-reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ad-reqs .fine{grid-column:1/-1;text-align:left}
.req-card{background:var(--pend);border:1px solid var(--pend-line);color:var(--pend-text);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.req-when{font-size:13px;font-weight:600}
.req-note{font-size:13px;overflow-wrap:anywhere;opacity:.9}
.req-card .actions{margin-top:6px}
.req-card .btn{min-height:30px;padding:5px 10px;font-size:12px}
.adcol{cursor:crosshair;touch-action:pan-y;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.ablk{position:absolute;border-radius:var(--r-sm);border:1px solid;font-size:11px;padding:3px 6px;overflow:hidden;line-height:1.25;user-select:none}
.ablk .bt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ablk .bs{font-size:10px;opacity:.85;white-space:nowrap}
.ablk.ev{background:var(--busy);border-color:var(--busy-line);color:var(--busy-text);cursor:grab;touch-action:none}
.ablk.ev.dragging{box-shadow:var(--shadow-md);z-index:5;cursor:grabbing}
.ablk.rq{background:var(--pend);border-color:var(--pend-line);color:var(--pend-text);border-style:dashed;cursor:pointer}
.ablk.ok{background:var(--free);border-color:var(--free-line);color:var(--free-text);cursor:pointer}
.ablk.ghost{background:var(--free);border-color:var(--accent);color:var(--free-text);border-style:dashed;pointer-events:none;z-index:4;font-weight:700}
.ablk .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--busy-text);z-index:3;pointer-events:none}
#adminview .scroller{overflow-x:auto;overflow-y:visible}
#adminview .grid.week{min-width:640px}
.ad-pop{position:fixed;z-index:50;width:min(320px,calc(100vw - 32px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.ad-pop[hidden]{display:none}
.ad-pop .fine{text-align:left;white-space:pre-line}
.ad-pop .actions .btn-primary{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm{background:var(--busy);color:var(--busy-text);border-radius:var(--r-md);padding:8px 10px;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- responsive ---------- */
@media (max-width: 760px){
  .cal{padding:8px 8px}
  .nav{gap:6px}
  .nav{flex-wrap:wrap}
  .nav-left{order:1;flex:1 1 auto}
  .nav-right{order:2;margin-left:auto;gap:6px}
  .nav-right .sync span{display:none}
  .cal-legend{order:3;flex-basis:100%;justify-content:center;flex-wrap:wrap;overflow:visible;white-space:normal;gap:2px 10px;font-size:11px}
  .panel{left:0;right:0;bottom:0;width:auto;max-height:88vh;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom, 0px)}
  .panel[data-state="peek"]{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));border-radius:var(--r-lg);border-bottom:1px solid var(--line);padding-bottom:0}
  .panel[data-state="open"]::before{content:"";display:block;width:40px;height:4px;border-radius:999px;background:var(--line-strong);margin:8px auto 0}
  .ad-pop{left:8px!important;right:8px;width:auto;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 360px){
  .wrap{padding-left:max(4px, env(safe-area-inset-left, 0px));padding-right:max(4px, env(safe-area-inset-right, 0px))}
  .cal{padding:6px;border-radius:var(--r-md)}
  .seg button{padding:5px 9px;font-size:12px}
  .nav h2{font-size:14px}
  .sync span{display:none}
  .legend{font-size:11px;gap:4px 8px}
  .bar-orb{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
.wrap{height:100vh;height:100dvh;min-height:0}
#adminview{overflow:auto}
.layout .scroller{overflow-y:auto;overflow-x:hidden}

/* ---------- request sheet: phone fixes ---------- */
.btn-send[aria-disabled="true"]{opacity:.45;cursor:not-allowed;box-shadow:none}
.field .req{color:var(--busy-text);font-weight:700;margin-left:2px}

/* ================= Airbnb-style theme ================= */

/* page + calendar card */
.wrap{gap:0;padding-block:0}

.panel{border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-md);background:var(--surface)}

.input{border:1px solid #b0b0b0;border-radius:var(--r-sm);padding:12px 14px;font-size:15px}

/* ---------- motion ---------- */
.panel{transition:transform .42s cubic-bezier(.22,.9,.3,1),opacity .3s ease,bottom .15s ease}

.panel[data-state="open"] .sheet-body{animation:sheetIn .38s cubic-bezier(.22,.9,.3,1) both}

@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= closing the bar: fade in place, never show the old bottom sheet ================= */
.panel[data-state="closed"]{visibility:hidden;pointer-events:none;transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s}
.panel[data-state="closed"]:not([data-was="open"]){top:var(--nav-top,8px)!important;left:var(--nav-left,8px)!important;width:var(--nav-w,auto)!important;right:auto!important;bottom:auto!important;height:var(--nav-h,48px)!important;max-height:none!important;border-radius:8px!important;padding:0!important;display:flex;align-items:stretch;overflow:hidden;transform:translateY(-6px)!important}
.panel[data-state="closed"]:not([data-was="open"]) .sheet-body{display:none!important}
.panel[data-state="closed"]:not([data-was="open"]) .sheet-bar{display:flex!important;flex:1;min-width:0;height:100%;padding:0 6px 0 4px;gap:10px;animation:none}
.panel[data-state="closed"]:not([data-was="open"]) .bar-x{display:inline-flex}
.panel[data-state="closed"]:not([data-was="open"]) .handle,.panel[data-state="closed"]:not([data-was="open"]) .bar-orb{display:none}
.panel[data-state="peek"],.panel[data-state="open"]{visibility:visible}

/* ================= Selection bar v2 ================= */
.panel[data-state="peek"],.panel[data-state="closed"]:not([data-was="open"]){
  background:linear-gradient(180deg,rgba(233,236,223,.07),rgba(233,236,223,.02)),rgba(14,17,11,.94)!important;
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid rgba(233,236,223,.13)!important;border-radius:14px!important;
  box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)!important}
.panel[data-state="peek"] .sheet-bar,.panel[data-state="closed"]:not([data-was="open"]) .sheet-bar{gap:12px;padding:0 8px 0 2px}
.bar-text{position:relative;display:flex!important;flex-direction:column;justify-content:center;gap:1px;padding-left:12px;min-width:0}
.bar-text::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:linear-gradient(180deg,#e9ecdf,#8f9a77);box-shadow:0 0 10px rgba(233,236,223,.35)}
.bar-text small#bar-sub{order:-1;font-family:var(--font)!important;font-size:10.5px!important;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-text strong#bar-count{font-size:15px!important;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.bar-text strong#bar-count i{font-style:normal;color:var(--faint);margin:0 6px;font-weight:400}
.bar-dur{flex:none;font-size:12px;font-weight:500;color:var(--muted);border:1px solid rgba(233,236,223,.16);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-cta{display:inline-flex!important;align-items:center;gap:8px;background:var(--text)!important;color:var(--bg)!important;border:0!important;border-radius:10px!important;font-weight:600;letter-spacing:-.005em;box-shadow:0 4px 14px rgba(233,236,223,.12)}
.bar-cta::after{content:"→";display:inline-block;transition:transform .2s ease}
.sheet-bar:hover .bar-cta{background:#ffffff!important}
.sheet-bar:hover .bar-cta::after{transform:translateX(3px)}
.bar-x{border-radius:999px!important;width:30px!important;height:30px!important;color:var(--muted)!important;font-size:14px!important;margin-left:8px!important}
.bar-x:hover{background:rgba(233,236,223,.08)!important;color:var(--text)!important}
@media (max-width: 420px){ .bar-dur{display:none} .bar-text strong#bar-count{font-size:14px!important} .bar-cta{padding:0 12px!important} }
@media (max-width: 330px){ .bar-cta::after{display:none} .bar-text{padding-left:9px} }

/* ================= Soothing pass ================= */
:root:not(#_){--text:#d2d6c7; --muted:#959a88; --accent:#c4c9b7; --accent-hover:#cfd3c3; --on-accent:#14180f;
  --brand:#c4c9b7; --brand-hover:#cfd3c3; --brand-text:#14180f; --sel:#bfc4b1; --sel-text:#14180f; --now:#b7bca9; --ok:#b7bca9}
.panel[data-state="peek"],.panel[data-state="closed"]:not([data-was="open"]){
  background:rgba(17,21,14,.92)!important;border:1px solid rgba(210,214,199,.08)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.35)!important}
.bar-text::before{background:#8f9682;box-shadow:none;width:2px}
.bar-text strong#bar-count{font-weight:500;color:var(--text)}
.bar-text small#bar-sub{font-weight:500;letter-spacing:.12em;color:var(--faint)!important}
.bar-dur{border-color:rgba(210,214,199,.1);color:var(--faint)}
.bar-cta{background:#b9bea9!important;color:#14180f!important;box-shadow:none!important;font-weight:500}
.sheet-bar:hover .bar-cta{background:#c6cab7!important}
.btn-send:not([aria-disabled="true"]){background:#b9bea9!important;border-color:#b9bea9!important}
.btn-send:not([aria-disabled="true"]):hover{background:#c6cab7!important}
.dayhead.today strong{background:#b9bea9!important;color:#14180f!important}
.strip button[aria-pressed="true"]{background:#b9bea9!important;border-color:#b9bea9!important}
.nowline::before{background:var(--now)}
.toast::before{background:#8f9682!important;color:#14180f!important}
.seg button[aria-pressed="true"]{color:var(--text)}

<script>
function boot() {
  var DATA = JSON.parse(document.getElementById('sched-data').textContent);
  var REQS = DATA.requests || [];
  var BOOKED = {}, PENDING = {}, WORK = {};
  (DATA.events || []).forEach(function (e) { (WORK[e.day] = WORK[e.day] || []).push([e.start, e.end]); });
  Object.keys(DATA.work || {}).forEach(function (d) { (WORK[d] = WORK[d] || []).push.apply(WORK[d], DATA.work[d]); });
  (function () {
    var add = function (m, d, spans) { (m[d] = m[d] || []).push.apply(m[d], spans || []); };
    REQS.forEach(function (r) { if (r.status === 'approved') add(BOOKED, r.day, r.spans); else if (r.status === 'pending') add(PENDING, r.day, r.spans); });
    Object.keys(DATA.booked || {}).forEach(function (d) { add(BOOKED, d, DATA.booked[d]); });
    Object.keys(DATA.pending || {}).forEach(function (d) { add(PENDING, d, DATA.pending[d]); });
  })();
  var hm = function (t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; };
  var START = hm(DATA.start), END = hm(DATA.end), N = (END - START) / 30, BUF = DATA.bufferMin || 0;

  // Dates as YYYY-MM-DD strings, computed in UTC so they never shift.
  var addDays = function (iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  var fmtDate = function (iso, opts) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, opts)); };
  var fmtT = function (m, ampm) { var h = Math.floor(m / 60) % 24, mm = m % 60, h12 = ((h + 11) % 12) + 1; return h12 + (mm || !ampm ? ':' + String(mm).padStart(2, '0') : '') + (ampm ? (h < 12 ? ' am' : ' pm') : ''); };
  var uMin = function (u) { return START + u * 30; };

  function nyNow() {
    var parts = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    return { date: parts.year + '-' + parts.month + '-' + parts.day, min: (+parts.hour % 24) * 60 + +parts.minute };
  }

  var DAYS = []; for (var i = 0; i < DATA.days; i++) DAYS.push(addDays(DATA.from, i));
  var WEEKS = Math.ceil(DAYS.length / 7);

  var state = { week: 0, dayIdx: 0, sel: new Set(), sent: null, view: 'week' };
  try { var v = localStorage.getItem('artur-view2'); if (v === 'day' || v === 'week') state.view = v; } catch (e) {}
  try { var saved = JSON.parse(sessionStorage.getItem('artur-sel') || '[]'); saved.forEach(function (k) { state.sel.add(k); }); } catch (e) {}
  var persist = function () { try { sessionStorage.setItem('artur-sel', JSON.stringify(Array.from(state.sel))); } catch (e) {} };

  function overlaps(u, spans, pad) {
    var s = uMin(u);
    return (spans || []).some(function (sp) { var a = hm(sp[0]) - (pad || 0), b = hm(sp[1]) + (pad || 0); return s < b && s + 30 > a; });
  }

  // Size the half-hour rows so the whole day (7 am to 10 pm) fits the screen height.
  function slotSize(narrow) {
    var sc = document.querySelector('.layout .scroller'); if (!sc || !sc.clientHeight) return 24;
    var hd = document.querySelector('#grid .dayhead'); var head = state.view === 'day' ? 0 : (hd && hd.offsetHeight ? hd.offsetHeight : 36);
    return Math.max(10, Math.min(40, Math.floor((sc.clientHeight - head - 6) / N)));
  }
  var FIT = 0, fitting = false;
  var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { FIT = 0; if (!(typeof ADMIN !== 'undefined' && ADMIN.on)) render(); }, 120); });

  // Only events longer than 3 hours get the 30-minute buffer before and after.
  function longOnly(spans) {
    var s = (spans || []).map(function (sp) { return [hm(sp[0]), hm(sp[1])]; }).sort(function (a, b) { return a[0] - b[0]; }), m = [];
    s.forEach(function (x) { var l = m[m.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push([x[0], x[1]]); });
    var t = function (v) { return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); };
    return m.filter(function (x) { return x[1] - x[0] > 180; }).map(function (x) { return [t(x[0]), t(x[1])]; });
  }

  // Status of every half hour in a day: free, busy, buf, pend or past.
  function dayStatus(date, now) {
    var out = [];
    for (var u = 0; u < N; u++) {
      var st = 'free';
      if (overlaps(u, WORK[date]) || overlaps(u, BOOKED[date])) st = 'busy';
      else if (overlaps(u, PENDING[date])) st = 'pend';
      else if (BUF && overlaps(u, longOnly(WORK[date]), BUF)) st = 'buf';
      if (st !== 'busy' && st !== 'pend' && (date < now.date || (date === now.date && uMin(u) < now.min))) st = 'past';
      out.push(st);
    }
    return out;
  }

  var LABEL = { busy: '', buf: '', pend: 'Pending', past: '' };
  var fmtC = function (m) { var h = Math.floor(m / 60) % 24, mm = m % 60; return (((h + 11) % 12) + 1) + ':' + String(mm).padStart(2, '0') + (h < 12 ? 'am' : 'pm'); };
  var ordn = function (n) { n = +n; var s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'); return n + s; };

  function render() {
    var now = nyNow();
    var dayView = state.view === 'day';
    var week = DAYS.slice(state.week * 7, state.week * 7 + 7);
    if (state.dayIdx >= week.length) state.dayIdx = 0;
    var shown = dayView ? [week[state.dayIdx]] : week;
    var gIdx = state.week * 7 + state.dayIdx;
    document.getElementById('v-day').setAttribute('aria-pressed', String(dayView));
    document.getElementById('v-week').setAttribute('aria-pressed', String(!dayView));
    document.getElementById('strip').hidden = !dayView;
    document.getElementById('prev').setAttribute('aria-label', dayView ? 'Previous day' : 'Previous week');
    document.getElementById('next').setAttribute('aria-label', dayView ? 'Next day' : 'Next week');

    document.getElementById('week-label').textContent = dayView
      ? fmtDate(week[state.dayIdx], window.innerWidth < 360 ? { weekday: 'short', month: 'short', day: 'numeric' } : { weekday: 'long', month: 'short', day: 'numeric' })
      : (window.innerWidth < 360 && fmtDate(week[0], { month: 'short' }) === fmtDate(week[week.length - 1], { month: 'short' })
          ? fmtDate(week[0], { month: 'short', day: 'numeric' }) + '–' + fmtDate(week[week.length - 1], { day: 'numeric' })
          : fmtDate(week[0], { month: 'short', day: 'numeric' }) + ' – ' + fmtDate(week[week.length - 1], { month: 'short', day: 'numeric' }));
    document.getElementById('prev').disabled = dayView ? gIdx === 0 : state.week === 0;
    document.getElementById('next').disabled = dayView ? gIdx >= DAYS.length - 1 : state.week >= WEEKS - 1;

    var statuses = {}; week.forEach(function (d) { statuses[d] = dayStatus(d, now); });
    var openCount = function (d) { return statuses[d].filter(function (s) { return s === 'free'; }).length; };

    var strip = document.getElementById('strip');
    strip.innerHTML = '';
    week.forEach(function (d, i) {
      var b = document.createElement('button');
      b.setAttribute('aria-pressed', String(i === state.dayIdx));
      if (d === now.date) b.className = 'today';
      b.innerHTML = '<small>' + fmtDate(d, { weekday: 'short' }) + '</small><strong>' + (window.innerWidth < 560 ? fmtDate(d, { day: 'numeric' }) : ordn(fmtDate(d, { day: 'numeric' }))) + '</strong>';
      b.setAttribute('aria-label', fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric' }) + ', ' + openCount(d) + ' open');
      b.onclick = function () { state.dayIdx = i; render(); };
      strip.appendChild(b);
    });

    var gw = document.getElementById('grid').clientWidth || window.innerWidth;
    var colW = (gw - 48) / shown.length, isNarrow = colW < 84, isMini = colW < 40;
    var SL = slotSize(isNarrow), H = N * SL;
    var grid = document.createElement('div');
    grid.className = 'grid' + (dayView ? '' : ' week') + (SL < 20 ? ' tight' : '') + (SL < 12 ? ' short' : '') + (isNarrow ? ' narrow' : '') + (isMini ? ' mini' : '');
    grid.style.setProperty('--cols', shown.length);
    grid.appendChild(document.createElement('div'));
    shown.forEach(function (d) {
      var h = document.createElement('div');
      h.className = 'dayhead' + (d === now.date ? ' today' : '');
      var n = openCount(d);
      h.innerHTML = '<small>' + fmtDate(d, { weekday: 'short' }) + '</small><strong>' + fmtDate(d, { day: 'numeric' }) + '</strong>';
      grid.appendChild(h);
    });
    var times = document.createElement('div');
    times.className = 'times'; times.style.height = H + 'px';
    for (var hr = 0; hr <= N / 2; hr++) { var s = document.createElement('span'); s.style.top = (hr * 2 * SL) + 'px'; s.textContent = isNarrow ? fmtT(START + hr * 60, true) : fmtC(START + hr * 60); if (hr === 0) s.className = 'first'; else if (hr === N / 2) s.className = 'last'; times.appendChild(s); }
    grid.appendChild(times);

    shown.forEach(function (d) {
      var col = document.createElement('div');
      col.className = 'col'; col.style.height = H + 'px'; col.style.setProperty('--slot', SL + 'px');
      var st = statuses[d], u = 0;
      while (u < N) {
        if (st[u] === 'free') {
          var key = d + '|' + u, on = state.sel.has(key);
          var b = document.createElement('button');
          b.className = 'slot';
          b.style.top = (u * SL) + 'px'; b.style.height = SL + 'px';
          var pOn = on && u > 0 && st[u - 1] === 'free' && state.sel.has(d + '|' + (u - 1)), nOn = on && u + 1 < N && st[u + 1] === 'free' && state.sel.has(d + '|' + (u + 1));
          if (on) { if (!pOn) b.classList.add('sel-s'); if (!nOn) b.classList.add('sel-e'); }
          if (on && !pOn) { var ue = u; while (ue + 1 < N && st[ue + 1] === 'free' && state.sel.has(d + '|' + (ue + 1))) ue++;
            b.textContent = isNarrow ? fmtT(uMin(u), false) : colW < 150 ? fmtC(uMin(u)) : fmtC(uMin(u)) + ' – ' + fmtC(uMin(ue + 1)); }
          else b.textContent = isNarrow ? fmtT(uMin(u), false) : fmtC(uMin(u));
          b.setAttribute('aria-pressed', String(on));
          b.setAttribute('aria-label', fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + fmtT(uMin(u), true) + ' to ' + fmtT(uMin(u) + 30, true) + ', open');
          b.dataset.key = key;
          b.onclick = toggle;
          col.appendChild(b); u++;
        } else if (st[u] === 'past') {
          var pc = document.createElement('div');
          pc.className = 'slot slot-past';
          pc.style.top = (u * SL) + 'px'; pc.style.height = SL + 'px';
          pc.textContent = '';
          pc.setAttribute('aria-label', fmtT(uMin(u), true) + ', passed');
          col.appendChild(pc); u++;
        } else {
          var v = st[u], a = u; while (u < N && st[u] === v) u++;
          var blk = document.createElement('div');
          blk.className = 'blk ' + v;
          blk.style.top = (a * SL + (v === 'pend' ? 2 : 0)) + 'px'; blk.style.height = ((u - a) * SL - (v === 'pend' ? 4 : 0)) + 'px';
          blk.textContent = LABEL[v];
          col.appendChild(blk);
        }
      }
      var nw0 = nyNow(); if (d === nw0.date && nw0.min > START && nw0.min < END) { var nl = document.createElement('div'); nl.className = 'nowline'; nl.style.top = ((nw0.min - START) / 30 * SL) + 'px'; col.appendChild(nl); }
      grid.appendChild(col);
    });
    var host = document.getElementById('grid'); host.innerHTML = ''; host.appendChild(grid);
    // If the page still scrolls, shrink the rows a little and draw again (once).
    if (false && !fitting && SL > 14) { var over = document.documentElement.scrollHeight - window.innerHeight; if (over > 2) { fitting = true; FIT += Math.ceil(over / N); render(); fitting = false; return; } }

(function () {
